name: Deploy What It Is / What It Ought to Be Pilot

on:
  push:
    branches: ["main"]
    paths:
      - "what-it-is-what-it-ought-to-be/**"
      - ".github/workflows/what-it-is-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pilot site
        uses: actions/upload-pages-artifact@v4
        with:
          path: what-it-is-what-it-ought-to-be

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
