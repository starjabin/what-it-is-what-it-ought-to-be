name: Runner startup diagnostic

on:
  push:
    branches: ['dev/gap-agent-foundation']
    paths: ['.github/workflows/runner-startup-diagnostic.yml']
  workflow_dispatch:

permissions: {}

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner starts without external actions
        run: |
          echo "Runner startup succeeded"
          uname -s
          node --version
