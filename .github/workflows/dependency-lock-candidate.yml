name: Dependency lock candidate

on:
  push:
    branches: ['dev/gap-agent-foundation']
    paths: ['.github/workflows/dependency-lock-candidate.yml']

permissions: {}

jobs:
  lock-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact public commit
        run: |
          test "$GITHUB_REPOSITORY" = "starjabin/what-it-is-what-it-ought-to-be"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git fetch --no-tags --depth=1 https://github.com/starjabin/what-it-is-what-it-ought-to-be.git "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Resolve lock without executing dependency scripts
        working-directory: production
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --registry=https://registry.npmjs.org/ @neondatabase/serverless
          node -e 'const f=require("fs"); const s=f.readFileSync("package-lock.json","utf8"); console.log("GAP_LOCK_BEGIN"); console.log(s); console.log("GAP_LOCK_END");'
