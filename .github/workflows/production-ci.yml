name: Production CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm install
        working-directory: production
      - name: Typecheck
        run: npm run typecheck
        working-directory: production
      - name: Build
        run: npm run build
        working-directory: production
